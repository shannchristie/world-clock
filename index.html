<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.5.37/moment-timezone-with-data-1970-2030.min.js"></script>

    <title>World Clock</title>
</head>
<style> 

body {
    background-color: #A3DFF1;
    font-family: sans-serif;
}
.container {
    max-width: 600px;
    margin: 60px auto;
    background: white;
    padding: 30px;
    box-shadow: rgba(100, 100, 111, 0.2) 0px 7px 29px 0px;
    border-radius:10px;
     justify-content: space-between;
     
  
}
.worldclock {
    background: #FFA43A;
    color: white;
    max-width: 600px;
    margin:  auto;
    padding: 30px;
    border-radius:10px;
      margin-bottom: 20px;
 
}
select {

    display: block; 
    width: 100%;
    font-size: 18px;
    border-radius: 4px;
    padding: 10px; 
    text-align: center;
    background-color: #A3DFF1; 
    color: white;                        
    border: none;                         
    appearance: none;                     
    -webkit-appearance: none;           
    -moz-appearance: none;                
    cursor: pointer;                    
}


h1 {
    text-align: center;
    font-family: sans-serif;
    font-size: 36px;
}

h2 {
    margin: 0 0 5px; 
    font-size: 28px;
}

.city {
    display: flex; 
    justify-content: space-between;
    margin: 20px 0;
    padding: 20px 0;
    border-bottom: 1px dashed rgb(209, 207, 207);

}

.city:last-child {
    border: none;
}

.date {
    opacity: 0.7;
}

.time {
    font-size: 48px;
    font-weight: bold; 
    color: #000000
}

.time small {
    font-size: 24px;
    vertical-align: middle; 
    line-height: 36px; 
    color: #FFC065
}

#backButton { 
    background-color: #FFC065;
    color: white;
    border: none;              
    font-size: 15px;
    font-family: Arial, Helvetica, sans-serif;
    border-radius: 6px; 
    padding: 8px 16px;         
    text-align: center;        
    line-height: 1;             
    display: inline-flex;       
    align-items: center;       
    justify-content: center;    
      cursor: pointer; 
  
}

a {
    color:#FFA43A;
}

footer {
max-width: 600px;
    margin: 60px auto;
    text-align: center; 
   
    color: rgba (0, 0, 0, 0.6);
}

</style>
<body>
    <div class="container">
    <div class="worldclock"><h1> 🌎 World Clock</h1></div>
    <div>
<select id="city"> 
    <option value="">Select a city... </option>
    <option value="current">My current location</option> 
    <option value="Europe/London">London 🇬🇧</option> 
    <option value="America/New_York">New York 🇺🇸</option>
    <option value="Australia/Melbourne">Melbourne 🇦🇺</option> 
</select>

<div class="cities">
<div class="city" id="copenhagen"> 
    <div>
    <h2> 🇩🇰 Copenhagen </h2>
<div class="date">February 8th 2026</div>
</div>
<div class="time"> 14:07 <small>PM</small> </div>
</div>
<div class="city" id="hongkong"> 
    <div>
    <h2> 🇭🇰 Hong Kong </h2>
<div class="date">February 8th 2026</div>
</div>
<div class="time"> 14:07 <small>PM</small> </div>
</div>
<div class="city" id="paris"> 
    <div>
    <h2> 🇫🇷 Paris </h2>
<div class="date">February 8th 2026</div>
</div>
<div class="time"> 14:07 <small>PM</small> </div>
</div>
</div>
</div>
<script> 
function updateTime() {

  let copenhagenElement = document.querySelector("#copenhagen"); 
  let copenhagenDateElement = copenhagenElement.querySelector(".date");
  let copenhagenTimeElement = copenhagenElement.querySelector(".time");
  let copenhagenTime = moment().tz("Europe/Copenhagen");
  copenhagenDateElement.innerHTML = copenhagenTime.format("dddd Do YYYY");
  copenhagenTimeElement.innerHTML = `${copenhagenTime.format("h:mm:ss")} <small>${copenhagenTime.format("A")}</small>`;


  let hongkongElement = document.querySelector("#hongkong"); 
  let hongkongDateElement = hongkongElement.querySelector(".date");
  let hongkongTimeElement = hongkongElement.querySelector(".time");
  let hongkongTime = moment().tz("Asia/Hong_Kong");
  hongkongDateElement.innerHTML = hongkongTime.format("dddd Do YYYY");
  hongkongTimeElement.innerHTML = `${hongkongTime.format("h:mm:ss")} <small>${hongkongTime.format("A")}</small>`;


  let parisElement = document.querySelector("#paris"); 
  let parisDateElement = parisElement.querySelector(".date");
  let parisTimeElement = parisElement.querySelector(".time");
  let parisTime = moment().tz("Europe/Paris");
  parisDateElement.innerHTML = parisTime.format("dddd Do YYYY");
  parisTimeElement.innerHTML = `${parisTime.format("h:mm:ss")} <small>${parisTime.format("A")}</small>`;
}

updateTime();

setInterval(updateTime, 1000);

function updateCity(event) {
    let cityTimeZone = event.target.value;
    if (cityTimeZone === "current") {
        cityTimeZone = moment.tz.guess();
    }
    if (!cityTimeZone) return; 

  
    let cityName = cityTimeZone.split("/")[1].replace(/_/g, " ");
    cityName = cityName
      .split(" ")
      .map(word => word.charAt(0).toUpperCase() + word.slice(1))
      .join(" ");

    
    let cityTime = moment().tz(cityTimeZone);

   
    let citiesElement = document.querySelector(".cities");
    citiesElement.innerHTML = `
      <div class="city"> 
        <div>
          <h2>${cityName}</h2>
          <div class="date">${cityTime.format("dddd, Do, YYYY")}</div>
        </div>
        <div class="time">${cityTime.format("h:mm:ss")} <small>${cityTime.format("A")}</small></div>
    <div class="backButton" id="backButton">Back to homepage</button></div>
    </div>
  `;


  const backButton = document.querySelector("#backButton");
  backButton.addEventListener("click", () => {
   
    window.location.href = "index.html"; 
  });
}


let citiesSelectElement = document.querySelector("#city");

citiesSelectElement.addEventListener("change", updateCity);


</script>

</footer>

</body>
</html>
